<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="somyaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#09090b" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Modern Geometric 'S' Monogram -->
  <g transform="translate(16, 12)">
    <path
      d="M 24 6 C 24 2.686 21.314 0 18 0 L 6 0 C 2.686 0 0 2.686 0 6 C 0 9.314 2.686 12 6 12 L 18 12 C 24.627 12 30 17.373 30 24 C 30 30.627 24.627 36 18 36 L 6 36 C 2.686 36 0 33.314 0 30 C 0 26.686 2.686 24 6 24 L 18 24 C 21.314 24 24 21.314 24 18 C 24 14.686 21.314 12 18 12 L 6 12 C -0.627 12 -6 6.627 -6 0"
      transform="translate(1, 2)"
      fill="none"
      stroke="url(#somyaGradient)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Accent Node -->
    <circle cx="16" cy="20" r="3.5" fill="#06b6d4" filter="url(#glow)" />
  </g>
</svg>
